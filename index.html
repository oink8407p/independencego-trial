<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독립GO 시범 운영 다운로드</title>
<style>
  :root { --bg: #fdf7ec; --card: #fffaf2; --brown: #6b4423; --text: #3b2a1a; --muted: #7a6650; --accent: #f2b544; --accent-dark: #c98a1c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; line-height: 1.6; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 28px; color: var(--brown); text-align: center; }
  .sub { margin: 0 0 28px; text-align: center; color: var(--muted); font-size: 15px; }
  .download { display: block; width: 100%; padding: 20px 16px; border-radius: 16px; background: var(--accent); border: 3px solid var(--accent-dark); color: var(--text); font-size: 22px; font-weight: 800; text-align: center; text-decoration: none; box-shadow: 0 4px 0 var(--accent-dark); }
  .download:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }
  .note { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
  section { margin-top: 28px; padding: 20px; background: var(--card); border: 2px solid #ead9bf; border-radius: 16px; }
  h2 { margin: 0 0 12px; font-size: 18px; color: var(--brown); }
  ol { margin: 0; padding-left: 22px; }
  li { margin-bottom: 10px; font-size: 16px; }
  li b { color: var(--brown); }
  .tip { margin-top: 12px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>독립GO</h1>
  <p class="sub">시범 운영 (10/19 ~ 10/28) · 안드로이드 전용</p>

  <a class="download" href="https://github.com/oink8407p/independencego-trial/releases/latest/download/IndependenceGO.apk">앱 다운로드</a>
  <p class="note">약 116MB · 와이파이에서 받는 것을 추천해요</p>

  <section>
    <h2>설치 방법</h2>
    <ol>
      <li>위의 <b>앱 다운로드</b> 버튼을 눌러요.</li>
      <li>다운로드가 끝나면 알림이나 다운로드 목록에서 <b>열기</b>를 눌러요.</li>
      <li>"출처를 알 수 없는 앱" 안내가 나오면 <b>설정</b> → <b>이 출처 허용</b>을 켜고 뒤로 돌아와요. (처음 한 번만)</li>
      <li><b>설치</b>를 누르면 끝!</li>
    </ol>
    <p class="tip">네이버 앱 안에서 다운로드가 안 되면, 오른쪽 위 메뉴에서 <b>다른 브라우저로 열기</b>(크롬·삼성 인터넷)를 눌러 주세요.</p>
  </section>
</main>
</body>
</html>
